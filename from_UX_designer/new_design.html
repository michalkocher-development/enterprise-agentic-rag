<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg:'#08090A', panel:'#0D0F10', raised:'#14171A',
        line:'rgba(255,255,255,0.08)', line2:'rgba(255,255,255,0.14)',
        fg:'#E8EAED', fg2:'#9AA0A6', fg3:'#666B70',
        live:'#6C8CFF', ok:'#3FBF8F', warn:'#E0A44A', bad:'#E2564D'
      },
      fontFamily: {
        sans:['Inter','system-ui','sans-serif'],
        mono:['"JetBrains Mono"','ui-monospace','monospace']
      }
    }
  }
}

<style>
  :root{
    --bg:#08090A; --panel:#0D0F10; --raised:#14171A;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --fg:#E8EAED; --fg2:#9AA0A6; --fg3:#666B70;
    --live:#6C8CFF; --ok:#3FBF8F; --warn:#E0A44A; --bad:#E2564D;
  }
  html,body{background:var(--bg);height:100%}
  body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;margin:0}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:6px;border:2.5px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
  :focus-visible{outline:2px solid var(--live);outline-offset:2px;border-radius:6px}

  /* graf */
  .edge-base{fill:none;stroke:var(--line2);stroke-width:1.25;transition:stroke .4s ease}
  .edge-flow{fill:none;stroke:var(--live);stroke-width:1.75;stroke-dasharray:5 11;stroke-linecap:round;opacity:0;transition:opacity .25s}
  .edge.is-taken .edge-base{stroke:rgba(108,140,255,.5)}
  .edge.is-flowing .edge-flow{opacity:1;animation:dashmove .9s linear infinite}
  .edge.is-loop.is-taken .edge-base{stroke:rgba(224,164,74,.55)}
  .edge.is-loop .edge-flow{stroke:var(--warn)}
  @keyframes dashmove{to{stroke-dashoffset:-32}}

  .gnode-box{fill:var(--raised);stroke:var(--line);stroke-width:1;transition:stroke .35s,fill .35s,opacity .35s}
  .gnode-title{fill:var(--fg2);font-size:12.5px;font-weight:500;transition:fill .35s}
  .gnode-meta{fill:var(--fg3);font-size:10.5px;font-family:"JetBrains Mono",monospace;transition:fill .35s}
  .gnode-ring{fill:none;stroke:var(--live);stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center}
  .gnode[data-state="active"] .gnode-box{stroke:var(--live);fill:rgba(108,140,255,.10)}
  .gnode[data-state="active"] .gnode-title{fill:var(--fg)}
  .gnode[data-state="active"] .gnode-meta{fill:var(--live)}
  .gnode[data-state="active"] .gnode-ring{animation:ring 1.8s ease-out infinite}
  .gnode[data-state="done"] .gnode-box{stroke:rgba(63,191,143,.42)}
  .gnode[data-state="done"] .gnode-meta{fill:var(--ok)}
  .gnode[data-state="idle"] .gnode-box{opacity:.5}
  .gnode[data-state="idle"] .gnode-title{opacity:.7}
  @keyframes ring{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.07)}}

  .edge-label{fill:var(--fg3);font-size:10.5px;font-family:"JetBrains Mono",monospace;opacity:.5;transition:opacity .35s,fill .35s}
  .edge-label.is-hot{opacity:1;fill:var(--warn)}

  /* lista z reorderingiem */
  .rank-list{position:relative;transition:height .55s cubic-bezier(.22,.61,.36,1)}
  .rank-item{position:absolute;left:0;right:0;height:40px;
    transition:transform .65s cubic-bezier(.22,.61,.36,1),opacity .4s,border-color .4s}
  .rank-item.is-cut{opacity:.16}
  .rank-item.is-kept{border-color:rgba(108,140,255,.45)}
  .score-bar{transition:width .7s cubic-bezier(.22,.61,.36,1)}

  .tl-section{animation:slidein .35s cubic-bezier(.22,.61,.36,1) both}
  @keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .caret::after{content:'';display:inline-block;width:7px;height:1.05em;background:var(--live);
    vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  .cite{cursor:pointer;transition:background .2s,border-color .2s}
  .cite:hover,.cite.is-on{background:rgba(108,140,255,.16);border-color:rgba(108,140,255,.5)}
  .chunk-row.is-highlit{border-color:rgba(108,140,255,.6);background:rgba(108,140,255,.07)}
  .example:hover{border-color:var(--line2);background:var(--raised)}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>

let LANG='pl';
const t = k => (I18N[LANG][k] ?? k);
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.getElementById('queryInput').placeholder =
    LANG==='pl' ? 'Zadaj pytanie o dokumenty w bazie…' : 'Ask a question about the indexed documents…';
  document.querySelectorAll('.langbtn').forEach(b=>{
    const on = b.dataset.lang===LANG;

const $=s=>document.querySelector(s);
const el=(tag,cls,html)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n;};
const NODE_LABEL={router:'nRouter',retrieve:'nRetrieve',local_rerank:'nRerank',
  grade_documents:'nGrade',rewrite_query:'nRewrite',generate:'nGenerate',hallucination_check:'nGuard'};
const ALL_CHUNKS={};
[...POOL_GAMING_BAD,...POOL_GAMING_GOOD,...POOL_NETINCOME].forEach(c=>ALL_CHUNKS[c.id]=c);
const STEP_H=44;

let speed=1, running=false, abort=false, timers=[];
const sleep=ms=>new Promise(r=>timers.push(setTimeout(r,ms/speed)));

function resetAll(){
  abort=true; timers.forEach(clearTimeout); timers=[]; running=false;
  document.querySelectorAll('.gnode').forEach(n=>{n.dataset.state='idle';const m=n.querySelector('.gnode-meta');if(m)m.textContent='—';});
  document.querySelectorAll('.edge').forEach(e=>e.classList.remove('is-taken','is-flowing'));
  document.querySelectorAll('.edge-label').forEach(l=>l.classList.remove('is-hot'));
  $('#timeline').innerHTML='';
  $('#emptyState').classList.remove('hidden'); $('#answerBody').classList.add('hidden');
  $('#answerText').textContent=''; $('#citeWrap').classList.add('hidden');
  $('#verdictWrap').classList.add('hidden'); $('#verdictWrap').innerHTML='';
  $('#loopBadge').classList.add('hidden'); $('#loopBadge').classList.remove('flex');
  $('#hdrLatency').textContent='0.00s'; $('#hdrVram').textContent='0 MB';
  $('#hdrTokens').textContent='0'; $('#sessionId').textContent='';
  $('#sendBtn').disabled=false;
}
function setNode(node,state,meta){
  const g=document.querySelector(`.gnode[data-node="${node}"]`); if(!g)return;
  g.dataset.state=state;
  if(meta!=null){const m=g.querySelector('.gnode-meta'); if(m)m.textContent=meta;}
}
function flowEdge(id,on){
  if(!id)return;
  const e=document.querySelector(`.edge[data-edge="${id}"]`); if(!e)return;
  e.classList.toggle('is-flowing',on); if(on)e.classList.add('is-taken');
  const lbl=document.querySelector(`.edge-label[data-lbl="${id}"]`); if(lbl&&on)lbl.classList.add('is-hot');
}

function tlSection(node){
  const tl=$('#timeline');
  const sec=el('section','tl-section rounded-lg border border-line bg-bg overflow-hidden shrink-0');
  sec.innerHTML=`
    <div class="flex items-center gap-2 px-2.5 h-8 border-b border-line">
      <span class="w-1.5 h-1.5 rounded-full bg-live shrink-0" data-dot></span>
      <span class="text-[12px] font-medium">${t(NODE_LABEL[node])}</span>
      <span class="ml-auto font-mono text-[10px] text-live" data-timer>${t('running')}…</span>
    </div>
    <div class="px-2.5 py-2" data-body></div>`;
  tl.append(sec);
  return sec;
}
function tlClose(sec,ms){
  sec.querySelector('[data-dot]').className='w-1.5 h-1.5 rounded-full bg-ok shrink-0';
  const tm=sec.querySelector('[data-timer]');
  tm.className='ml-auto font-mono text-[10px] text-fg3';
  tm.textContent=(ms/1000).toFixed(2)+'s';
}
const scrollBottom=()=>{const tl=$('#timeline');tl.scrollTo({top:tl.scrollHeight,behavior:'smooth'});};
const scrollTo=sec=>{const tl=$('#timeline');tl.scrollTo({top:sec.offsetTop-8,behavior:'smooth'});};

function rowChunk(c,i){
  const r=el('div','chunk-row rank-item rounded-md border border-line bg-panel px-2 flex items-center gap-2');
  r.dataset.chunk=c.id;
  r.innerHTML=`
    <span class="font-mono text-[9.5px] text-fg3 w-3.5 shrink-0" data-idx>${i+1}</span>
    <span class="font-mono text-[10.5px] text-fg2 shrink-0 max-w-[40%] truncate">${c.file}</span>
    ${c.table?`<span class="shrink-0 px-1 rounded bg-raised font-mono text-[9px] text-fg3">${t('table')}</span>`:''}
    <span class="text-[10.5px] text-fg3 truncate flex-1 min-w-0">${c.prev}</span>
    <span class="w-10 h-[3px] rounded bg-raised overflow-hidden shrink-0"><span class="score-bar block h-full bg-live/70" style="width:0"></span></span>
    <span class="font-mono text-[10px] text-fg3 w-7 text-right shrink-0" data-score></span>`;
  return r;
}
function layoutList(list,order){
  order.forEach((id,i)=>{
    const item=list.querySelector(`[data-chunk="${id}"]`); if(!item)return;
    item.style.transform=`translateY(${i*STEP_H}px)`;
    const idx=item.querySelector('[data-idx]'); if(idx)idx.textContent=i+1;
  });
  list.style.height=(order.length*STEP_H-4)+'px';
}
function renderRetrieve(body,d){
  body.innerHTML=`<p class="font-mono text-[10.5px] text-fg3 mb-1.5">${d.pool.length} ${t('candidates')} · ${t('pass')} ${d.pass}</p>`;
  const list=el('div','rank-list'); body.append(list);
  d.pool.forEach((c,i)=>list.append(rowChunk(c,i)));
  layoutList(list,d.pool.map(c=>c.id));
}
async function renderRerank(body,d,pool,sec){
  body.innerHTML=`<p class="text-[11px] text-fg2 mb-1.5 leading-snug">${t('rerankHint')}</p>`;
  const list=el('div','rank-list'); body.append(list);
  pool.forEach((c,i)=>list.append(rowChunk(c,i)));
  layoutList(list,pool.map(c=>c.id));
  scrollTo(sec);
  await sleep(700); if(abort)return;
  layoutList(list,d.order);
  d.order.forEach(id=>{
    const it=list.querySelector(`[data-chunk="${id}"]`);
    it.querySelector('[data-score]').textContent=d.scores[id].toFixed(2);
    it.querySelector('.score-bar').style.width=(d.scores[id]*100)+'%';
  });
  $('#hdrVram').textContent=d.vram+' MB';
  setNode('local_rerank','active',d.vram+' MB');
  await sleep(1500); if(abort)return;
  d.order.forEach((id,i)=>list.querySelector(`[data-chunk="${id}"]`).classList.add(i<4?'is-kept':'is-cut'));
  await sleep(600); if(abort)return;
  layoutList(list,d.order.slice(0,4));
  d.order.slice(4).forEach(id=>{
    const it=list.querySelector(`[data-chunk="${id}"]`);
    it.style.transform=`translateY(${3*STEP_H}px)`; it.style.opacity='0';
  });
  body.append(el('p','mt-1.5 font-mono text-[10px] text-fg3',`4 ${t('kept')} · 6 ${t('cut')}`));
}
function renderGrade(body,d){
  body.innerHTML=`<p class="text-[11px] text-fg2 mb-1.5 leading-snug">${t('gradeHint')}</p>`;
  d.verdicts.forEach((v,i)=>{
    const c=ALL_CHUNKS[v.id];
    const row=el('div','chunk-row rounded-md border border-line bg-panel px-2 py-1.5 mb-1');
    row.dataset.chunk=v.id;
    row.style.opacity='0'; row.style.transition='opacity .3s';
    row.innerHTML=`
      <div class="flex items-center gap-1.5">
        <span class="px-1 rounded font-mono text-[9px] ${v.ok?'bg-ok/15 text-ok':'bg-warn/15 text-warn'}">${v.ok?t('relevant'):t('irrelevant')}</span>
        <span class="font-mono text-[10px] text-fg3 truncate">${c?c.file:v.id}</span>
      </div>
      <p class="text-[11px] text-fg2 mt-0.5 leading-snug">${v.why[LANG]}</p>`;
    body.append(row);
    timers.push(setTimeout(()=>{row.style.opacity='1';},(300+i*220)/speed));
  });
  if(d.verdicts.every(v=>!v.ok))
    body.append(el('p','mt-1.5 text-[11px] text-warn leading-snug',t('allRejected')));
}
function renderRewrite(body,d){
  body.innerHTML=`
    <div class="rounded-md border border-line bg-panel px-2 py-1.5 mb-1">
      <p class="font-mono text-[9px] text-fg3 mb-0.5">${t('rwFrom')}</p>
      <p class="text-[11.5px] text-fg3 line-through decoration-fg3/50">${d.from[LANG]}</p>
    </div>
    <div class="rounded-md border border-warn/40 bg-warn/[0.06] px-2 py-1.5">
      <p class="font-mono text-[9px] text-warn mb-0.5">${t('rwTo')}</p>
      <p class="text-[11.5px] text-fg">${d.to[LANG]}</p>
    </div>`;
}

function mdLite(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong class="font-semibold text-white">$1</strong>');
}
async function streamAnswer(key,dur){
  const full=ANSWERS[key][LANG], words=full.split(/(\s+)/), box=$('#answerText');
  box.textContent=''; box.classList.add('caret');
  const per=dur/words.length; let acc='',n=0;
  for(const w of words){
    if(abort)return;
    acc+=w; n++;
    box.innerHTML=mdLite(acc); $('#hdrTokens').textContent=n;
    await sleep(per);
  }
  box.classList.remove('caret');
}
function renderCites(ids){
  if(!ids.length)return;
  const wrap=$('#citeList'); wrap.innerHTML='';
  ids.forEach((id,i)=>{
    const c=ALL_CHUNKS[id]; if(!c)return;
    const chip=el('button','cite rounded-md border border-line bg-bg px-2 py-1 text-left');
    chip.innerHTML=`<span class="font-mono text-[10px] text-live">[${i+1}]</span><span class="font-mono text-[10px] text-fg2 ml-1.5">${c.file}</span>`;
    const hl=on=>{
      chip.classList.toggle('is-on',on);
      document.querySelectorAll(`.chunk-row[data-chunk="${id}"]`).forEach(r=>{
        r.classList.toggle('is-highlit',on);
        if(on)r.scrollIntoView({block:'nearest',behavior:'smooth'});
      });
    };
    chip.addEventListener('mouseenter',()=>hl(true));
    chip.addEventListener('mouseleave',()=>hl(false));
    chip.addEventListener('focus',()=>hl(true));
    chip.addEventListener('blur',()=>hl(false));
    wrap.append(chip);
  });
  $('#citeWrap').classList.remove('hidden');
}
function renderVerdicts(d){
  const w=$('#verdictWrap'); w.innerHTML='';
  [[d.grounded,'grounded'],[d.useful,'useful']].forEach(([ok,key])=>{
    w.append(el('span',
      `inline-flex items-center gap-1.5 px-2 h-6 rounded-md border font-mono text-[10px] ${ok?'border-ok/35 bg-ok/10 text-ok':'border-bad/35 bg-bad/10 text-bad'}`,
      `${ok?'✓':'✕'} ${t(key)}`));
  });
  w.classList.remove('hidden');
}

/* ═══ sterownik przebiegu ═══ */
async function run(key){
  resetAll(); abort=false; running=true;
  $('#sendBtn').disabled=true;
  const sc=SCEN[key];
  $('#askedText').textContent=sc.query[LANG];
  $('#emptyState').classList.add('hidden'); $('#answerBody').classList.remove('hidden');
  $('#sessionId').textContent='session-'+Math.random().toString(36).slice(2,9);

  const t0=performance.now();
  const tick=setInterval(()=>{$('#hdrLatency').textContent=((performance.now()-t0)/1000).toFixed(2)+'s';},60);
  timers.push(tick);

  let lastPool=null, loops=0;

  for(const st of sc.steps){
    if(abort)break;
    if(st.edge){flowEdge(st.edge,true); await sleep(500); if(abort)break;}
    if(st.node==='rewrite_query'){
      loops++;
      const b=$('#loopBadge'); b.classList.remove('hidden'); b.classList.add('flex');
      $('#loopCount').textContent=loops+'/3';
    }
    setNode(st.node,'active',t('running'));
    const sec=tlSection(st.node), body=sec.querySelector('[data-body]');
    scrollBottom();
    const s0=performance.now();

    if(st.node==='router'){
      body.innerHTML=`<p class="text-[12px] leading-snug">${st.data.decision==='retrieve'?t('decisionRetrieve'):t('decisionDirect')}</p>`;
      await sleep(st.dur);
    } else if(st.node==='retrieve'){
      lastPool=st.data.pool; renderRetrieve(body,st.data); scrollTo(sec); await sleep(st.dur);
    } else if(st.node==='local_rerank'){
      await renderRerank(body,st.data,lastPool,sec);
    } else if(st.node==='grade_documents'){
      renderGrade(body,st.data); scrollTo(sec); await sleep(st.dur);
    } else if(st.node==='rewrite_query'){
      renderRewrite(body,st.data); scrollBottom(); await sleep(st.dur);
    } else if(st.node==='generate'){
      body.innerHTML=`<p class="text-[11px] text-fg2 leading-snug">${t('genHint')}</p>`;
      scrollBottom();
      await streamAnswer(sc.answer,st.dur);
      renderCites(st.data.cites);
    } else if(st.node==='hallucination_check'){
      body.innerHTML=''; scrollBottom(); await sleep(st.dur); renderVerdicts(st.data);
    }

    if(abort)break;
    flowEdge(st.edge,false);
    const ms=performance.now()-s0;
    setNode(st.node,'done',(ms/1000).toFixed(2)+'s');
    tlClose(sec,ms);
  }

  if(!abort){
    flowEdge('e9',true); await sleep(500); flowEdge('e9',false);
    setNode('__end','done'); scrollBottom();
  }
  clearInterval(tick);
  $('#sendBtn').disabled=false; running=false;
}

  $('#queryInput').value=SCEN[b.dataset.run].query[LANG];

}));
$('#sendBtn').addEventListener('click',()=>{if(!running)run('simple');});
$('#queryInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!running)run('simple');});
$('#resetBtn').addEventListener('click',resetAll);
document.querySelectorAll('.spd').forEach(b=>b.addEventListener('click',()=>{
  speed=+b.dataset.spd;

    const on=x===b;
    x.classList.toggle('bg-raised',on); x.classList.toggle('text-fg',on); x.classList.toggle('text-fg3',!on);
  });
